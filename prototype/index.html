<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="DroidNode 手机节点控制台的交互原型，用于评审界面方向。">
<title>DroidNode 控制台 · 交互原型</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    <symbol id="i-pod" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 7h9M17 7h4M3 17h4M11 17h10"/><circle cx="14" cy="7" r="2"/><circle cx="7.5" cy="17" r="2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a2 2 0 0 0-2 2v9"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 4v8"/><path d="M7.5 7a7 7 0 1 0 9 0"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="8" rx="2"/><path d="M21 11v2"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9.5a13 13 0 0 1 18 0M6.5 13a8.5 8.5 0 0 1 11 0M10 16.5a3.6 3.6 0 0 1 4 0"/></symbol>
    <symbol id="i-cell" viewBox="0 0 24 24"><path d="M5 20v-4M10 20v-8M15 20v-12M20 20V4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
  </defs>
</svg>

<div class="page">
  <header class="page-head">
    <h1 class="brand">
      <svg class="pulse-mini" viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4h6l2-3 3 6 2-3h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      DroidNode 控制台
    </h1>
    <p class="page-sub">交互设计原型仅供开发参考，具体以实际页面效果为准。</p>
  </header>

  <div class="stage">
    <div class="phone" role="application" aria-label="DroidNode 控制台原型">
      <div class="statusbar">
        <span class="mono" id="clock">00:26</span>
        <span class="sys">
          <svg class="i i--s" aria-hidden="true"><use href="#i-cell"/></svg>
          <svg class="i i--s" aria-hidden="true"><use href="#i-wifi"/></svg>
          <svg class="i i--s" aria-hidden="true"><use href="#i-battery"/></svg>
        </span>
      </div>

      <div class="app">
        <header class="appbar">
          <button class="icon-btn icon-btn--bare appbar-back" id="back-btn" data-act="back" aria-label="返回" hidden>
            <svg class="i i--flip" aria-hidden="true"><use href="#i-chevron"/></svg>
          </button>
          <h1 id="screen-title">节点</h1>
          <span class="pill" id="node-pill"><span class="dot dot--ok"></span>运行中</span>
        </header>
        <main class="view" id="view" tabindex="-1"></main>
        <div class="join-foot" id="join-foot" hidden>
          <button class="btn btn--primary btn--block" data-act="join-submit" id="join-go">加入</button>
        </div>
        <nav class="tabbar" id="tabbar" role="tablist" aria-label="主要导航"></nav>
      </div>

      <div class="homebar"><span></span></div>
      <div class="scrim" id="scrim" data-act="close-sheet"></div>
      <section class="sheet" id="sheet" aria-live="polite" aria-label="详情"></section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="原型说明"></aside>
</div>

<script src="app.js"></script>
</body>
</html>

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.droidnode'
    compileSdk 35

    defaultConfig {
        applicationId "com.droidnode"
        minSdk 26
        // E3 probe: targetSdk 35 requires a verified exec strategy for the
        // OCI rootfs (Android 10+ blocks exec from app-writable directories).
        targetSdk 35
        versionCode 25
        versionName "0.1.24"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}

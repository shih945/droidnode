plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.droidnode'
    compileSdk 35

    defaultConfig {
        applicationId "com.droidnode"
        minSdk 26
        // E3 probe: targetSdk 35 requires a verified exec strategy for the
        // OCI rootfs (Android 10+ blocks exec from app-writable directories).
        targetSdk 35
        versionCode 66
        versionName "0.1.65"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 签名材料只在设置了 ANDROID_KEYSTORE_PATH 时启用（CI 从 Secrets 还原）；
    // 本地没有该变量时 release 仍然能构建，只是未签名。
    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// 发布流水线用 -PversionCode / -PversionName 覆盖上面的字面值。
// 保持字面值是为了让本地打包脚本（scripts/build-apk-win.ps1）能按行解析并自增版本号。
def versionCodeProp = project.findProperty('versionCode')
def versionNameProp = project.findProperty('versionName')
if (versionCodeProp) {
    android.defaultConfig.versionCode = versionCodeProp.toString().toInteger()
}
if (versionNameProp) {
    android.defaultConfig.versionName = versionNameProp.toString()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
}
